services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    container_name: list-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "StrongP@ssw0rd!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "StrongP@ssw0rd!" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "StrongP@ssw0rd!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: list-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mssql
      - DB_USER=sa
      - DB_PASSWORD=StrongP@ssw0rd!
      - DB_NAME=master
      - PORT=8080
    depends_on:
      mssql:
        condition: service_healthy

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: list-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mssql_data:
